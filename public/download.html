<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiVolt One — Download App</title>
  <link rel="icon" type="image/png" href="/assets/digivolt-icon-black.png" />
  <script>
    (function() {
      var ua = (navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase();
      var isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
      var iosUrl = 'https://apps.apple.com/us/app/digivolt/id6766707727';
      var androidUrl = 'https://play.google.com/store/apps/details?id=com.digi02.digivolt';

      if (isIOS) {
        window.location.replace(iosUrl);
      } else {
        window.location.replace(androidUrl);
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #000000; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; text-align: center;">
  <div style="max-width: 360px; width: 100%;">
    <div style="width: 48px; height: 48px; border-radius: 50%; background: #111; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
      <span style="font-size: 24px;">⚡</span>
    </div>
    <h1 style="font-size: 22px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.02em;">Redirecting to DigiVolt App</h1>
    <p style="font-size: 14px; color: #999; margin: 0 0 28px; line-height: 1.5;">Opening your official app store...</p>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <a href="https://apps.apple.com/us/app/digivolt/id6766707727" style="display: block; background: #ffffff; color: #000000; text-decoration: none; padding: 14px; border-radius: 9999px; font-weight: 600; font-size: 14px;">Open Apple App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.digi02.digivolt" style="display: block; background: #1c1c1e; color: #ffffff; text-decoration: none; padding: 14px; border-radius: 9999px; font-weight: 600; font-size: 14px;">Open Google Play Store</a>
    </div>
  </div>
</body>
</html>
